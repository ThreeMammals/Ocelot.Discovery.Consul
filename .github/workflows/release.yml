# Releases non-beta versions, without 'beta*' suffix
name: Release
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: .NET Info
        run: dotnet --info

      - name: Install XML tools
        run: |
          sudo apt update
          sudo apt install libxml2-utils xmlstarlet
      - name: Read XML
        id: xml
        run: |
          xml_value=$(xmllint --xpath "string(//Project/PropertyGroup/Version)" ./src/Ocelot.Discovery.Consul.csproj)
          echo Version: $xml_value
          echo "Version=$xml_value" >> $GITHUB_OUTPUT
          xml_value=$(xmllint --xpath "string((//Project/ItemGroup)[2]/PackageReference[@Include='Ocelot']/@Version)" ./src/Ocelot.Discovery.Consul.csproj)
          echo Ocelot Ref Ver: $xml_value
          echo "OcelotRefVer=$xml_value" >> $GITHUB_OUTPUT
          xml_value=$(xmllint --xpath "string((//Project/ItemGroup)[2]/PackageReference[@Include='Consul']/@Version)" ./src/Ocelot.Discovery.Consul.csproj)
          echo Consul Ref Ver: $xml_value
          echo "ConsulRefVer=$xml_value" >> $GITHUB_OUTPUT
      # Replace Version, PackageReleaseNotes in .csproj
      - name: Update XML in .csproj
        id: ver
        run: |
          echo Version: ${{ steps.xml.outputs.Version }}
          echo Ocelot Ref Ver: ${{ steps.xml.outputs.OcelotRefVer }}
          echo Consul Ref Ver: ${{ steps.xml.outputs.ConsulRefVer }}
          s_Version="${{ steps.xml.outputs.Version }}"
          if [[ "$s_Version" == *-* ]]; then
            echo Version contains '-'
            first_part=$(echo "$s_Version" | cut -d'-' -f1)
            echo First part: $first_part
            new_value=$first_part
          else
            new_value=$s_Version
          fi
          echo Going to replace version... from $s_Version to $new_value
          xmlstarlet ed -L -u "//Project/PropertyGroup/Version" -v "$new_value" ./src/Ocelot.Discovery.Consul.csproj
          xml_value=$(xmllint --xpath "string(//Project/PropertyGroup/Version)" ./src/Ocelot.Discovery.Consul.csproj)
          echo Replaced Version: $xml_value
          echo "PkgVersion=$xml_value" >> $GITHUB_OUTPUT

          xml_value=$(xmllint --xpath "string(//Project/PropertyGroup/PackageReleaseNotes)" ./src/Ocelot.Discovery.Consul.csproj)
          tag_name="${{ github.ref_name }}"
          echo Going to replace release notes tag... in $xml_value to $tag_name
          new_value="${xml_value/tag*/tag\/$tag_name}"
          xmlstarlet ed -L -u "//Project/PropertyGroup/PackageReleaseNotes" -v "$new_value" ./src/Ocelot.Discovery.Consul.csproj
          xml_value=$(xmllint --xpath "string(//Project/PropertyGroup/PackageReleaseNotes)" ./src/Ocelot.Discovery.Consul.csproj)
          echo Replaced PackageReleaseNotes: $xml_value
      - name: README.md
        run: |
          # Replaces relative GitHub paths with NuGet-friendly absolute URLs
          sed -i 's|/.github/img/ocelot_icon.png|https://raw.githubusercontent.com/ThreeMammals/Ocelot.Discovery.Consul/main/.github/img/ocelot_icon.png|g; s|/.github/img/consul.net_icon.svg|https://raw.githubusercontent.com/ThreeMammals/Ocelot.Discovery.Consul/main/.github/img/consul.net_icon.svg|g; s|/.github/img/consul.hashicorp_icon.svg|https://raw.githubusercontent.com/ThreeMammals/Ocelot.Discovery.Consul/main/.github/img/consul.hashicorp_icon.svg|g' README.md
          # Removes tags <sub> and </sub>
          sed -i 's/<\/\?sub>//g' README.md
          echo "::group::New content of README.md"
          cat README.md
          echo "::endgroup::"

      - name: Restore dependencies
        run: dotnet restore ./Ocelot.Discovery.Consul.slnx
      - name: Pack project
        run: dotnet pack ./src/Ocelot.Discovery.Consul.csproj --configuration Release --output ./packages /p:ContinuousIntegrationBuild=true
      # - name: Publish to GitHub Packages
      #   run: dotnet nuget push ./packages/*.nupkg --source "https://nuget.pkg.github.com/ThreeMammals/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
      # - name: Publish to NuGet
      #   run: dotnet nuget push ./packages/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ secrets.NUGET_API_KEY_2025 }} --skip-duplicate

      - name: GitHub Release
        uses: softprops/action-gh-release@v2 # https://github.com/softprops/action-gh-release
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.PkgVersion }}
          OCELOT_VERSION: ${{ steps.xml.outputs.OcelotRefVer }}
          CONSUL_VERSION: ${{ steps.xml.outputs.ConsulRefVer }}
        with:
          # tag_name: 0.0.3 # Name of a tag. defaults to github.ref_name
          body: |
            ## Version [${{ env.PACKAGE_VERSION }}](https://www.nuget.org/packages/Ocelot.Discovery.Consul/${{ env.PACKAGE_VERSION }})
            > For Ocelot release: [${{ env.OCELOT_VERSION }}](https://github.com/ThreeMammals/Ocelot.Discovery.Consul/releases/tag/${{ env.OCELOT_VERSION }})
            > Ocelot package: v[${{ env.OCELOT_VERSION }}](https://www.nuget.org/packages/Ocelot/${{ env.OCELOT_VERSION }})
            > Consul package: v[${{ env.CONSUL_VERSION }}](https://www.nuget.org/packages/Consul/${{ env.CONSUL_VERSION }})

            For more details, see Ocelot [Releases](https://github.com/ThreeMammals/Ocelot/releases) &rarr; [${{ env.OCELOT_VERSION }}](https://www.nuget.org/packages/Ocelot/${{ env.OCELOT_VERSION }})
          files: |
            packages/*.*pkg
          prerelease: false
          make_latest: true
      # - name: Release to Ocelot Repo
      #   uses: softprops/action-gh-release@v3 # https://github.com/softprops/action-gh-release
